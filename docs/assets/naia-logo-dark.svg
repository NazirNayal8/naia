<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 178 56" width="356" height="112" color="#f0f0f0" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title">
  <title id="title">NAIA</title>
