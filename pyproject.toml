[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "naia"
version = "0.1.0a0"
description = "NAIA: assistant-first tasks, experiment suites, and architecture inspection"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Nazir Nayal"}]
readme = "README.md"
keywords = ["research", "workflow", "experiments", "architecture", "codex", "claude", "slurm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/NazirNayal8/naia"
Repository = "https://github.com/NazirNayal8/naia"
Documentation = "https://github.com/NazirNayal8/naia/blob/main/README.md"
Issues = "https://github.com/NazirNayal8/naia/issues"

[project.scripts]
naia = "naia.cli:main"
lab = "naia.cli:main"
naia-arch = "naia_arch.cli:main"
lab-arch = "naia_arch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
naia = ["assets/*"]
naia_arch = ["assets/*"]
