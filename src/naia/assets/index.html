<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project NAIA</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div><h1 id="pageTitle">NAIA</h1><div class="sub" id="pageSubtitle">Project queue · one decision at a time</div></div><div class="header-actions"><button class="ghost" id="sync">Refresh</button><a class="button-link ghost" id="archiveLink" href="/?view=archive">Archive</a><span class="queue-action"><button class="ghost" id="newTask">New task</button><span id="pauseCurrentAction"></span><button id="resolveNext">Resolve next</button></span></div></header>
<nav class="view-tabs" role="tablist" aria-label="NAIA views"><button class="view-tab active" id="queueTab" role="tab" aria-selected="true" aria-controls="queueView" data-view="queue" data-tab="tasks">Task queue</button><button class="view-tab" id="suitesTab" role="tab" aria-selected="false" aria-controls="suitesView" data-view="suites" data-tab="suites">Suite graph</button><button class="view-tab" id="archTab" role="tab" aria-selected="false" aria-controls="archView" data-view="arch" data-tab="architectures">Architecture</button></nav>
<main>
<div id="status" role="status" aria-live="polite"></div>
<section class="queue-view" id="queueView" role="tabpanel" aria-labelledby="queueTab"><div class="deck-toolbar"><span class="count" id="count">Loading queue…</span><span id="reorderHint">Unpack cards to reorder them</span><button class="ghost" id="deckToggle">Unpack all</button></div><div class="deck-wrap packed" id="deckWrap"><section class="deck packed" id="deck"></section></div></section>
<section id="suitesView" role="tabpanel" aria-labelledby="suitesTab" hidden><div class="suite-toolbar"><div class="suite-heading"><h2>Experiment suites</h2><div class="sub" id="suiteMeta"></div></div><div class="suite-filters"><div class="suite-legend" aria-label="Suite statuses"><span class="legend-item"><span class="legend-dot active"></span>Active</span><span class="legend-item"><span class="legend-dot sealed"></span>Sealed</span><span class="legend-item"><span class="legend-dot pending"></span>Pending</span></div><button class="ghost sealed-toggle" id="sealedToggle" aria-pressed="false" title="Fold sealed suites out of the graph">Hide sealed</button></div></div><div class="graph-panel"><div class="graph-controls"><button id="graphZoomIn" aria-label="Zoom in">+</button><button id="graphZoomOut" aria-label="Zoom out">−</button><button id="graphFit" aria-label="Center graph" title="Fit the graph to the panel">⌾</button><button id="graphReset" aria-label="Reset card layout" title="Reset card layout">⟲</button></div><svg id="suiteGraph" role="group" aria-label="Interactive scientific suite lineage"></svg><div class="graph-hint">Drag a card to move it · scroll to zoom · click a card to open its suite</div></div></section>
<section id="archView" role="tabpanel" aria-labelledby="archTab" hidden></section>
<section class="queue-view archive-view" id="archiveView" hidden></section>
</main>
<dialog id="taskDialog" aria-labelledby="formTitle"><div class="form-head"><h2 id="formTitle">New task</h2><button class="ghost" type="button" data-close="taskDialog">Close</button></div><form id="taskForm"><p class="form-error" data-error role="alert"></p><div class="form-grid">
<label>Stable task ID<input id="taskId" required placeholder="REVIEW-001"><span class="hint">IDs cannot be changed after creation.</span></label>
<label>Place in deck<select id="taskPlacement"></select><span class="hint">Deck order defines priority; its numeric rank remains hidden.</span></label>
<label class="wide">Title<input id="taskTitle" required placeholder="Short task title"></label>
<label>Type<input id="taskType" value="task" placeholder="evaluation, design-review, …"></label><label>Owner<input id="taskOwner" value="unassigned"></label>
<label class="wide">Goal<textarea id="taskGoal" required placeholder="The concrete purpose of this task"></textarea></label>
<label class="wide">Decision or deliverable<textarea id="taskDecision" required placeholder="What must be decided or produced"></textarea></label>
<label class="wide">Review materials<textarea id="taskMaterials" placeholder="One repository path or URL per line"></textarea></label>
<label class="wide">Related tasks (soft dependencies)<textarea id="taskDependencies" placeholder="One task ID per line"></textarea><span class="hint">Unfinished related tasks are highlighted, but never block this card.</span></label>
</div><div class="form-actions"><button class="ghost" type="button" data-close="taskDialog">Cancel</button><button type="submit">Save task</button></div></form></dialog>
<dialog id="completionDialog" aria-labelledby="completionTitle"><div class="form-head"><h2 id="completionTitle">Complete task</h2><button class="ghost" type="button" data-close="completionDialog">Close</button></div><form id="completionForm"><p class="form-error" data-error role="alert"></p><p class="completion-context" id="completionContext"></p><label>Completion note<textarea class="completion-note" id="completionNote" placeholder="Write your decision, observations, caveats, and follow-up thoughts here."></textarea><span class="hint">This paragraph is saved with the completed task in the NAIA audit trail.</span></label><div class="form-actions"><button class="ghost" type="button" data-close="completionDialog">Cancel</button><button type="submit">Complete task</button></div></form></dialog>
<dialog class="suite-dialog" id="suiteDialog" aria-labelledby="suiteModalTitle"><div class="suite-window-bar"><div class="suite-window-title" id="suiteModalTitleWrap"><span class="suite-status" id="suiteModalStatus"></span><h2 id="suiteModalTitle"></h2></div><div class="suite-window-actions"><div class="suite-status-editor"><select id="suiteStatusSelect" aria-label="Suite status"></select><button class="secondary" id="suiteStatusSave">Set status</button><button id="suiteSealButton">Seal suite</button></div><a class="button-link ghost" id="suiteOpenTab" target="_blank" rel="noopener">Open in new tab</a><button class="ghost" type="button" data-close="suiteDialog">Close</button></div></div><div class="suite-modal-summary" id="suiteModalSummary"></div><iframe class="suite-card-frame" id="suiteCardFrame" title="Suite card"></iframe><div class="suite-empty" id="suiteNoCard" hidden>This suite has no readable card.</div></dialog>
<script src="/app.js"></script>
</body></html>
